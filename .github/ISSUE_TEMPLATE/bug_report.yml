name: Bug report
description: 편집기에서 재현되는 문제를 알려주세요.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제 설명
      description: 기대한 동작과 실제 동작을 함께 적어주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 가능하면 최소 JSON 문서나 재현 저장소를 첨부해주세요.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: package 버전
      placeholder: "@kokoa/clotho-editor 0.1.3 / @kokoa/clotho 0.1.7"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      placeholder: "브라우저, 운영체제, React 버전"
  - type: textarea
    id: context
    attributes:
      label: 추가 정보
      description: 화면 캡처, 오류 로그와 관련 링크를 첨부해주세요.
