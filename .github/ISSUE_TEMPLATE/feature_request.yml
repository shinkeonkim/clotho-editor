name: Feature request
description: 새로운 편집 기능이나 host integration을 제안해주세요.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: 사용 사례
      description: 어떤 작업을 더 쉽게 만들고 싶은지 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
